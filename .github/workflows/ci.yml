name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: cmake -S . -B build -DSEMICOLON_DESKTOP=ON -DSEMICOLON_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: node --test tests/dashboard.test.js
      - run: python3 tools/check_repository.py
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [navigation-esp32cam, navigation-esp32dev]
        ultrasonic: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-6.1.19-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio==6.1.19
      - name: Configure optional sensor
        run: echo '#define SEMICOLON_ULTRASONIC ${{ matrix.ultrasonic }}' > include/config.h
      - run: pio run -e ${{ matrix.environment }}
