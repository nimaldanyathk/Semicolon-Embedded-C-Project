[platformio]
default_envs = navigation-esp32cam
src_dir = firmware
include_dir = include

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -I firmware/shared

[env:navigation-esp32cam]
board = esp32cam
build_src_filter = +<navigation/*.cpp>
build_flags = ${env.build_flags} -DSEMICOLON_CAMERA=1
board_build.embed_txtfiles =
    firmware/navigation/web/index.html
    firmware/navigation/web/app.js
    firmware/navigation/web/style.css

[env:navigation-esp32dev]
board = esp32dev
build_src_filter = ${env:navigation-esp32cam.build_src_filter}
build_flags = ${env.build_flags} -DSEMICOLON_CAMERA=0
board_build.embed_txtfiles = ${env:navigation-esp32cam.board_build.embed_txtfiles}

; Requires the user's exported Edge Impulse Arduino library in lib/.
; Deliberately excluded from default builds; no trained model is committed.
[env:currency-esp32cam]
board = esp32cam
board_build.partitions = huge_app.csv
build_src_filter = +<currency/*.cpp>
build_flags = ${env.build_flags}
lib_ldf_mode = deep+
